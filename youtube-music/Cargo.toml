[package]
name = "youtube-music"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nori-plugin-sdk.workspace = true
# YouTube Music's requests and answers, without I/O of its own (github.com/filipton/innertube-music).
innertube-music = { git = "https://github.com/filipton/innertube-music" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
innertube-music = { git = "https://github.com/filipton/innertube-music", features = ["fixtures"] }
