[workspace]
resolver = "2"
members = ["orbit", "youtube-music", "playback", "moving-covers", "showcase", "soundcloud"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# nori's SDK (norifm/nori, crates/plugin-sdk), at the commit Cargo.lock names; `cargo update -p nori-plugin-sdk`
# moves it to nori's newest.
nori-plugin-sdk = { git = "https://github.com/norifm/nori" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
